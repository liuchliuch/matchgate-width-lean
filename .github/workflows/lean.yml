name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: mathlib-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Restore pinned Mathlib artifacts
        run: lake exe cache get
      - name: Build official Comparator
        run: |
          git clone https://github.com/leanprover/comparator.git .tooling/comparator
          git -C .tooling/comparator checkout d03acab154d269c06e60e4de7e4cc85deebff94b
          cd .tooling/comparator
          lake +leanprover/lean4:v4.34.1 build comparator lean4export
      - name: Clean build, axiom audit, replay and statement comparison
        run: |
          python3 scripts/verify.py --clean \
            --comparator .tooling/comparator/.lake/build/bin/comparator \
            --lean4export .tooling/comparator/.lake/packages/lean4export/.lake/build/bin/lean4export \
            --local-comparator
